name: Deploy MotionOS Prototype

on:
  push:
    branches: [main]
    paths:
      - "apps/motionos-prototype/**"
      - ".github/workflows/motionos-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "motionos-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload MotionOS prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/motionos-prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
